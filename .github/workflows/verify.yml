name: Verify theme

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Check the committed outputs before any command can regenerate them.
      - run: npm run release:check
      - run: npm run build
      - name: Ensure rebuilding leaves generated files unchanged
        run: git diff --exit-code -- Ectoplasma.theme.css dist/Ectoplasma.css
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            console.error(`Expected tag v${version}, received ${process.env.GITHUB_REF_NAME}`);
            process.exit(1);
          }
          JS
